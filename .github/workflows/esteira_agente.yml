name: Execucao do Agente de Credito

on:
  push:
    branches:
      - main
  schedule:
    # Configuração oficial para rodar às 07:00 de São Paulo (Segunda a Sexta)
    - cron: '47 9 * * *'
  workflow_dispatch:

jobs:
  rodar-agente:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install google-genai feedparser requests python-dotenv

      - name: Executar Agente de Credito
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_API_KEY: ${{ secrets.CALLMEBOT_API_KEY }}
        run: python agente_credito.py
