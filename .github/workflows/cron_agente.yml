name: Execucao Diaria do Agente de Credito

name: Execucao Diaria do Agente de Credito

on:
  push:
    branches:
      - main     # Sempre que você alterar um arquivo na main, o robô roda na hora!
  schedule:
    - cron: '0 10 * * 1-5'
  workflow_dispatch:

jobs:
  rodar-agente:
    runs-on: ubuntu-latest

    steps:
    - name: Copiar codigo do repositorio
      uses: actions/checkout@v3

    - name: Configurar o Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar bibliotecas necessarias
      run: |
        python -m pip install --upgrade pip
        pip install google-genai feedparser requests python-dotenv

    - name: Rodar o Script do Agente de Credito
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        CALLMEBOT_API_KEY: ${{ secrets.CALLMEBOT_API_KEY }}
        CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_USER: ${{ secrets.GITHUB_USER }}
        GITHUB_REPO: "agente_credito_pf"
      run: python agente_credito.py
